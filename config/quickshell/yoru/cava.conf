# ============================================================================
#  cava — visualizador de audio de la barra (junto a la canción)
#  Quickshell lo arranca solo mientras suena algo y lee sus números.
#  Más barras o más fluidez: cambia "bars" o "framerate".
# ============================================================================
[general]
bars = 6
# 20 basta para que se vea fluido; cada actualización obliga a redibujar
# la barra (y a niri a recomponer la pantalla), así que más gasta más
framerate = 20
autosens = 1

[input]
# "pulse" también vale con PipeWire (pipewire-pulseaudio): el cava de
# Fedora viene sin soporte directo de pipewire
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 55
