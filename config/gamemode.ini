; ============================================================================
;  gamemode.ini — lo que hace gamemode mientras juegas
;  install.sh lo enlaza en ~/.config/gamemode.ini
;
;  Se activa al abrir un juego con gamemode: en Steam, en las Propiedades
;  del juego › Opciones de lanzamiento:   gamemoderun %command%
;  (con MangoHud:  gamemoderun mangohud %command%)
;  Comprobar si está activo:  gamemoded -s
; ============================================================================

[general]
; La CPU a tope (vuelve a «powersave» al cerrar el juego)
desiredgov=performance
; El juego, con algo más de prioridad que el resto (hace falta estar en el
; grupo gamemode: install.sh → ajustes_juegos)
renice=10
; Sin SCHED_ISO: el kernel de Fedora no lo tiene (solo daría errores)
softrealtime=off
; Que el salvapantallas no salte mientras juegas con mando
inhibit_screensaver=1

[custom]
; Yoru: «No molestar» y el mando en la barra (comun/Juego.qml)
start=qs -c yoru ipc call juego empezar
end=qs -c yoru ipc call juego terminar
