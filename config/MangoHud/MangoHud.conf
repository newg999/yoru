# ============================================================================
#  MangoHud — lo que se ve encima del juego (FPS, temperaturas...)
#  Se activa en las Opciones de lanzamiento del juego en Steam:
#      gamemoderun mangohud %command%
#  Mayús derecha+F12 lo enseña o lo esconde · Mayús derecha+F11, de esquina
#  Todas las opciones: /usr/share/doc/mangohud/MangoHud.conf.example
# ============================================================================

# Estilo Yoru: compacto, oscuro translúcido y en blanco
horizontal
hud_compact
round_corners=8
background_alpha=0.45
background_color=1a1b1e
text_color=e5e9f0
gpu_color=e5e9f0
cpu_color=e5e9f0
fps_color_change
fps_color=bf616a,ebcb8b,e5e9f0
fps_value=30,60
font_size=18
position=top-left
offset_y=40

# Qué se ve
fps
frametime=0
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram

# Teclas
toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
