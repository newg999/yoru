# ============================================================================
#  kitty — terminal
#  Recargar sin cerrar: Ctrl+Shift+F5       Referencia: https://sw.kovidgoyal.net/kitty/conf/
# ============================================================================

font_family      JetBrainsMono Nerd Font
font_size        11.5

window_padding_width 12
# Transparencia: Niri desenfoca lo que hay detrás (rules.kdl)
background_opacity   0.82
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 1

# Pestañas
tab_bar_edge      bottom
tab_bar_style     powerline
tab_powerline_style slanted

# --- Colores: Nord ---------------------------------------------------------
foreground              #d8dee9
background              #2e3440
selection_foreground    #2e3440
selection_background    #88c0d0
cursor                  #d8dee9
cursor_text_color       #2e3440
url_color               #88c0d0

active_tab_foreground   #2e3440
active_tab_background   #88c0d0
inactive_tab_foreground #d8dee9
inactive_tab_background #3b4252
tab_bar_background      #2e3440

# negro
