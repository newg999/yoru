# ============================================================================
#  mpv — el reproductor de vídeo de Yoru, con la interfaz uosc
#  install.sh enlaza config/mpv en ~/.config/mpv y baja uosc (scripts/ y
#  fonts/, fuera de git: ver uosc_bajar en install.sh)
#
#  Teclas: espacio = pausa · ← → = 5 s · ↑ ↓ = volumen · f = pantalla
#  completa · s = captura · clic derecho = menú de uosc · q = salir
#  (recordando por dónde ibas)
# ============================================================================

# Interfaz: la de uosc (la de mpv, apagada)
osc=no
osd-bar=no
border=no

# Calidad, con la gráfica decodificando el vídeo
profile=high-quality
vo=gpu-next
hwdec=auto-safe

# Al acabar, se queda en el último fotograma; al cerrar, recuerda dónde ibas
keep-open=yes
save-position-on-quit=yes

# Audio y subtítulos en español si los hay
alang=es,spa,es-ES,en,eng,ja,jpn
slang=es,spa,es-ES,en,eng

# Capturas (tecla s) junto a las de niri
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png

# La letra de Yoru en los textos de mpv
osd-font="JetBrainsMono Nerd Font"

# Colores del tema (los escribe «yoru tema»: tema/aplicar.py)
include="~/.local/state/yoru/tema/mpv.conf"
