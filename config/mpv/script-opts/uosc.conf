# ============================================================================
#  uosc — la interfaz de mpv en Yoru (los colores, en mpv.conf → yoru tema)
#  Todas las opciones: https://github.com/tomasklaen/uosc/blob/main/src/uosc.conf
# ============================================================================

# Barra de progreso fina, que crece al acercar el ratón; con la ventana en
# pantalla completa también se ve fina al pausar
timeline_style=line
timeline_line_width=2
timeline_size=28
progress=windowed

# Arriba, el título solo en pantalla completa (en niri no hay barra de ventana)
top_bar=no-border

# Botones de abajo: menú, subtítulos, audio, lista, capítulos, pantalla completa
controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen

# Sin sombras de texto y con esquinas finas, como el resto de Yoru
text_border=0
border_radius=2

# Se esconde enseguida al no mover el ratón
autohide=yes
