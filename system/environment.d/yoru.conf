# Variables de la sesión. systemd las carga al entrar, así que llegan a todo:
# niri, la barra, lo que abre el lanzador y también las apps Flatpak.
# install.sh lo enlaza en ~/.config/environment.d/

# Apps Qt (VirtualBox, VLC, qBittorrent...) en oscuro: usan los colores de
# ~/.config/kdeglobals (Breeze Dark) gracias a plasma-integration. Sin esto,
# fuera de Plasma salen en blanco.
QT_QPA_PLATFORMTHEME=kde

# ~/.local/bin (claude, yoru...) en el PATH también para lo que se abre desde
# el lanzador o los atajos de niri, que no leen ~/.zshrc
PATH=$HOME/.local/bin:$PATH
