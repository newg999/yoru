# ============================================================================
#  greetd — pantalla de inicio de sesión de Yoru
# ----------------------------------------------------------------------------
#  greetd arranca un niri mínimo (niri-greeter.kdl) que muestra gtkgreet con
#  el estilo de gtkgreet.css. Los tres archivos los COPIA install.sh a
#  /etc/greetd/ (no son enlaces: pertenecen a root). Si cambias alguno:
#    sudo cp system/greetd/{config.toml,niri-greeter.kdl,gtkgreet.css} /etc/greetd/
#
#  Si algo falla y no puedes entrar: Ctrl+Alt+F3 abre una consola de texto.
# ============================================================================

[terminal]
vt = 1

[default_session]
command = "niri -c /etc/greetd/niri-greeter.kdl"
user = "greetd"
