# Ajustes del kernel para jugar (los mismos que SteamOS).
# install.sh lo copia a /etc/sysctl.d/ (ajustes_juegos)

# Sin la «mitigación» de split locks: el kernel frena a propósito los
# programas que los hacen, y algunos juegos (sobre todo por Proton) los
# hacen a menudo: tirones de varios milisegundos
kernel.split_lock_mitigate = 0
